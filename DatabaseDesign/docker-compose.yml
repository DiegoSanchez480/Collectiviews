version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: Collectiviews
    restart: always
    volumes:
      - ./init_collectiviews.sql:/docker-entrypoint-initdb.d/init.sql
      # - ./data:/var/lib/mysql                   # Mount a volume for data persistence (optional)
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=Collectiviews
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - 4444:3306
